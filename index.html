<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>JASST STORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Tektur:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Необов'язково: поза Telegram демо працює без SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="star" viewBox="0 0 24 24"><polygon points="12,1 14.6,9 23,9 16.2,14 18.8,22.5 12,17.4 5.2,22.5 7.8,14 1,9 9.4,9"/></symbol>
  </svg>

  <header class="top">
    <a class="brand" href="#top" aria-label="JASST STORE — на початок">
      <span class="brand-logo"><img src="Logo.jpg" alt="JASST"></span>
      <span class="brand-store">STORE</span>
    </a>
    <button class="cart-btn" id="cartOpen" aria-label="Відкрити кошик">
      <span>Кошик</span>
      <b id="cartCount">0</b>
    </button>
  </header>

  <main id="top">
    <section class="hero">
      <svg class="hero-star" aria-hidden="true"><use href="#star"/></svg>
      <p class="kicker"><svg class="ico"><use href="#star"/></svg> Нові надходження · Зима 2026</p>
      <h1 class="display"><span>JASST</span><span>STORE</span></h1>
      <p class="hero-text">Оригінальний одяг, взуття та аксесуари світових брендів в одному місці.</p>
      <button class="btn btn-invert" id="heroCta">Перейти до каталогу</button>
      <ul class="perks">
        <li>Якісний одяг</li>
        <li>Швидка доставка</li>
        <li>Підбір розміру в чаті</li>
      </ul>
    </section>

    <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>

    <section class="catalog" id="catalog">
      <div class="catalog-head">
        <h2 class="display-sm">Каталог</h2>
      </div>

      <label class="search">
        <span class="visually-hidden">Пошук товарів</span>
        <input id="search" type="search" placeholder="Пошук: бренд, худі, кросівки…" autocomplete="off">
        <button class="search-clear" id="searchClear" aria-label="Очистити пошук" hidden>✕</button>
      </label>

      <div class="filters">
        <div class="chips" id="chips" role="tablist" aria-label="Категорії"></div>
      </div>
      <div class="toolbar">
        <span class="count" id="resultCount"></span>
        <div class="sort" data-label="Бренд">
          <select id="brand" aria-label="Бренд"></select>
        </div>
        <div class="sort" data-label="Сортування">
          <select id="sort" aria-label="Сортування">
            <option value="default">Рекомендовані</option>
            <option value="asc">Спочатку дешевші</option>
            <option value="desc">Спочатку дорожчі</option>
            <option value="new">Спочатку новинки</option>
          </select>
        </div>
      </div>

      <div class="grid" id="grid"></div>
    </section>

    <footer class="foot">
      <svg class="ico"><use href="#star"/></svg>
      <span>JASST STORE · демоверсія каталогу</span>
    </footer>
  </main>

  <div class="scrim" id="scrim"></div>

  <section class="sheet" id="productSheet" role="dialog" aria-modal="true" aria-labelledby="pName" hidden>
    <button class="close" data-close aria-label="Закрити картку товару">✕</button>
    <div class="sheet-body" id="productBody"></div>
  </section>

  <section class="sheet" id="cartSheet" role="dialog" aria-modal="true" aria-labelledby="cartTitle" hidden>
    <button class="close" data-close aria-label="Закрити кошик">✕</button>
    <div class="sheet-body" id="cartBody"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
